name: Release APK

# Push a tag like v0.3.0 to build a signed APK and publish it as a GitHub Release.
# "Run workflow" from the Actions tab builds one without publishing (download it from the run's artifacts).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Set up signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              echo "::error::Add the KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD secrets before publishing a release."
              exit 1
            fi
            echo "::warning::No signing key configured; this test build is signed with a throwaway debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ZP_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Work out version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=0.0.0-test.${{ github.run_number }}" >> "$GITHUB_ENV"
          fi

      - name: Test and build
        env:
          ZP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ZP_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ZP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon testDebugUnitTest assembleRelease \
            -PversionName="$VERSION_NAME" -PversionCode=$((100 + ${{ github.run_number }}))
          cp app/build/outputs/apk/release/app-release.apk "zune-pocket-$VERSION_NAME.apk"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: zune-pocket-*.apk
          generate_release_notes: true

      - name: Keep test build
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: zune-pocket-apk
          path: zune-pocket-*.apk
