name: Release APK

# Publishes a signed APK as GitHub Release vX.Y.Z when any of these happen:
#   - a tag like v0.3.0 is pushed
#   - a branch like release/v0.3.0 is pushed (GitHub creates the tag)
#   - "Run workflow" is clicked in the Actions tab with a version filled in
# "Run workflow" with the version left empty makes a test build (download it from the run's artifacts).
on:
  push:
    tags: ["v*"]
    branches: ["release/v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 0.3.1 (leave empty for a test build)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Work out version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ "$GITHUB_REF" == refs/heads/release/v* ]]; then
            VERSION="${GITHUB_REF_NAME#release/v}"
          elif [ -n "$INPUT_VERSION" ]; then
            VERSION="${INPUT_VERSION#v}"
          fi
          if [ -n "$VERSION" ]; then
            echo "VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
            echo "PUBLISH=true" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=0.0.0-test.${{ github.run_number }}" >> "$GITHUB_ENV"
            echo "PUBLISH=false" >> "$GITHUB_ENV"
          fi

      - name: Set up signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [ "$PUBLISH" = "true" ]; then
              echo "::error::Add the KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD secrets before publishing a release."
              exit 1
            fi
            echo "::warning::No signing key configured; this test build is signed with a throwaway debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ZP_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test and build
        env:
          ZP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ZP_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ZP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon testDebugUnitTest assembleRelease \
            -PversionName="$VERSION_NAME" -PversionCode=$((100 + ${{ github.run_number }}))
          cp app/build/outputs/apk/release/app-release.apk "zune-pocket-$VERSION_NAME.apk"

      - name: Publish release
        if: env.PUBLISH == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          name: Zune Pocket ${{ env.VERSION_NAME }}
          files: zune-pocket-*.apk
          generate_release_notes: true

      - name: Keep test build
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: zune-pocket-apk
          path: zune-pocket-*.apk
