name: Release APK

# Publishes a signed APK as GitHub Release vX.Y.Z when any of these happen:
#   - a tag like v0.3.0 is pushed
#   - a branch like release/v0.3.0 is pushed (GitHub creates the tag)
#   - "Run workflow" is clicked in the Actions tab with a version filled in
# "Run workflow" with the version left empty makes a test build (download it from the run's artifacts).
on:
  push:
    tags: ["v*"]
    branches: ["release/v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 0.3.1 (leave empty for a test build)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Work out version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ "$GITHUB_REF" == refs/heads/release/v* ]]; then
            VERSION="${GITHUB_REF_NAME#release/v}"
          elif [ -n "$INPUT_VERSION" ]; then
            VERSION="${INPUT_VERSION#v}"
          fi
          if [ -n "$VERSION" ]; then
            echo "VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
            echo "PUBLISH=true" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=0.0.0-test.${{ github.run_number }}" >> "$GITHUB_ENV"
            echo "PUBLISH=false" >> "$GITHUB_ENV"
          fi

      - name: Set up signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [ "$PUBLISH" = "true" ]; then
              echo "::error::Add the KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD secrets before publishing a release."
              exit 1
            fi
            echo "::warning::No signing key configured; this test build is signed with a throwaway debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ZP_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

          # Use KEY_ALIAS if the keystore has a key by that name; otherwise, if it holds exactly one
          # key, use that one (so a mistyped alias secret can't break the release).
          keys=$(keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASSWORD" | grep PrivateKeyEntry | cut -d, -f1)
          wanted=$(printf '%s' "$KEY_ALIAS" | tr -d '[:space:]"')
          if printf '%s\n' "$keys" | grep -qxF "$wanted"; then
            alias="$wanted"
          elif [ "$(printf '%s\n' "$keys" | grep -c .)" = "1" ]; then
            alias="$keys"
            echo "::warning::KEY_ALIAS doesn't match the keystore; using its only key, '$alias'."
          else
            echo "::error::KEY_ALIAS doesn't match any key in the keystore. Keys found: $(printf '%s' "$keys" | paste -sd ' ' -)"
            exit 1
          fi
          echo "ZP_KEY_ALIAS=$alias" >> "$GITHUB_ENV"

      - name: Test and build
        env:
          ZP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ZP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest assembleRelease \
            -PversionName="$VERSION_NAME" -PversionCode=$((100 + ${{ github.run_number }})) 2>&1 | tee build.log
          cp app/build/outputs/apk/release/app-release.apk "zune-pocket-$VERSION_NAME.apk"

      # Copies the key lines of a failed build into an error annotation, readable from the run summary.
      - name: Report build errors
        if: failure()
        env:
          ZP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          # Signing problems: list the key names actually in the keystore (names aren't secret).
          if [ -n "$ZP_KEYSTORE_PATH" ] && [ -f "$ZP_KEYSTORE_PATH" ]; then
            aliases=$(keytool -list -keystore "$ZP_KEYSTORE_PATH" -storepass "$ZP_KEYSTORE_PASSWORD" 2>&1 | grep -iE "PrivateKeyEntry|password|error" | cut -d, -f1 | paste -sd ';' -)
            echo "::error title=Keys in your keystore::$aliases"
          fi
          [ -f build.log ] || exit 0
          summary=$( { grep -A12 "What went wrong" build.log; grep -E "^e: |FAILED|Error:|error:|Lint found" build.log; } | head -60 )
          encoded=$(printf '%s' "$summary" | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
          echo "::error title=Build failed::$encoded"
          for f in app/build/reports/lint-results-*.txt; do [ -f "$f" ] && head -40 "$f"; done

      - name: Publish release
        if: env.PUBLISH == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          name: Zune Pocket ${{ env.VERSION_NAME }}
          files: zune-pocket-*.apk
          generate_release_notes: true

      - name: Keep test build
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: zune-pocket-apk
          path: zune-pocket-*.apk
